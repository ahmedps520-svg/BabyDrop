<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf7ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Baby Boy — Gift Registry</title>
<meta name="description" content="Pick a gift for the baby boy and tap to claim it, so nobody brings the same thing twice.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Baby Boy">
<meta property="og:title" content="Baby Boy — Gift Registry">
<meta property="og:description" content="Pick a gift and tap to claim it, so nobody brings the same thing twice.">
<meta property="og:url" content="https://ahmedps520-svg.github.io/BabyDrop/">
<meta property="og:image" content="https://ahmedps520-svg.github.io/BabyDrop/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --sky-50:#f3faf4;
  --sky-100:#e1f3e4;
  --sky-200:#c3e6c9;
  --sky-300:#98d4a5;
  --sky-400:#5cb377;
  --sky-500:#2f8f52;
  --sky-600:#217a42;
  --sky-700:#145c34;
  --ink:#182e20;
  --ink-soft:#4c6957;
  --ink-faint:#8aa192;
  --card:#ffffff;
  --line:rgba(33,122,66,.14);
  --coral:#ff5a5f;
  --coral-dark:#e5383b;
  --mint:#2fbf8a;
  --gold:#f2b53c;
  --shadow-sm:0 1px 2px rgba(18,40,28,.06), 0 4px 14px rgba(18,40,28,.06);
  --shadow-md:0 6px 22px rgba(20,64,40,.12), 0 2px 6px rgba(20,64,40,.06);
  --shadow-lg:0 18px 48px rgba(20,64,40,.20);
  --r-lg:22px;
  --r-md:16px;
  --r-pill:999px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji",sans-serif;
  background:var(--sky-50);
  color:var(--ink);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
body.sheet-open{overflow:hidden;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
a{color:inherit;}

/* ============================================================
   HEADER + BLOBS
   ============================================================ */
.hero{
  position:relative;
  overflow:hidden;
  padding:calc(var(--sat) + 54px) calc(var(--sar) + 20px) 40px calc(var(--sal) + 20px);
  background:linear-gradient(168deg,#eafaee 0%,#dcf3e2 42%,#f4faf5 100%);
  isolation:isolate;
}
.hero::after{
  content:"";
  position:absolute;left:0;right:0;bottom:-1px;height:44px;
  background:linear-gradient(to bottom,rgba(244,250,255,0),var(--sky-50));
  pointer-events:none;
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(46px);
  opacity:.62;
  z-index:-1;
  will-change:transform;
  pointer-events:none;
}
.blob-a{
  width:300px;height:300px;top:-96px;inset-inline-start:-84px;
  background:radial-gradient(circle at 35% 35%,#b9e8c2,#5fbd7c);
  animation:drift-a 22s ease-in-out infinite;
}
.blob-b{
  width:250px;height:250px;top:22px;inset-inline-end:-92px;
  background:radial-gradient(circle at 60% 40%,#d5f0d9,#7fd39a);
  animation:drift-b 27s ease-in-out infinite;
}
.blob-c{
  width:210px;height:210px;bottom:-108px;inset-inline-start:38%;
  background:radial-gradient(circle at 50% 50%,#e6f7e8,#a8e0b8);
  animation:drift-c 31s ease-in-out infinite;
  opacity:.5;
}
@keyframes drift-a{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  33%{transform:translate3d(34px,26px,0) scale(1.09);}
  66%{transform:translate3d(-18px,44px,0) scale(.95);}
}
@keyframes drift-b{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  40%{transform:translate3d(-40px,30px,0) scale(1.12);}
  75%{transform:translate3d(16px,-24px,0) scale(.94);}
}
@keyframes drift-c{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(-32px,-30px,0) scale(1.14);}
}

.eyebrow{
  margin:0 0 12px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#1f7a42;
  opacity:0;
  animation:rise .7s var(--ease) .05s forwards;
}
.headline{
  margin:0;
  font-size:clamp(34px,10.5vw,52px);
  line-height:1.08;
  font-weight:800;
  letter-spacing:-.025em;
  background:linear-gradient(105deg,#1f7a42 0%,#4caf6b 45%,#f2c85e 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  padding-bottom:.08em;
  opacity:0;
  animation:rise .8s var(--ease) .12s forwards;
}
@keyframes rise{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:none;}
}

/* ============================================================
   SYNC BANNER / TOAST
   ============================================================ */
.toast{
  position:fixed;
  inset-inline:12px;
  top:calc(var(--sat) + 12px);
  z-index:80;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  box-shadow:var(--shadow-md);
  border:1px solid var(--line);
  font-size:13.5px;
  font-weight:500;
  color:var(--ink-soft);
  transform:translateY(-140%);
  opacity:0;
  transition:transform .45s var(--spring), opacity .3s var(--ease);
  pointer-events:none;
}
.toast.show{transform:none;opacity:1;pointer-events:auto;}
.toast .dot{
  flex:0 0 auto;width:9px;height:9px;border-radius:50%;
  background:var(--coral);
  box-shadow:0 0 0 4px rgba(255,90,95,.16);
}
.toast.ok .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(47,191,155,.16);}

/* ============================================================
   GRID
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:22px;
  padding:10px calc(var(--sar) + 18px) calc(var(--sab) + 132px) calc(var(--sal) + 18px);
  max-width:1180px;
  margin:0 auto;
}
@media (min-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:26px;padding-inline:28px;}
}
@media (min-width:960px){
  .grid{grid-template-columns:repeat(3,1fr);gap:30px;padding-inline:36px;}
}

/* ============================================================
   CARD
   ============================================================ */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  opacity:0;
  transform:translateY(28px) scale(.94);
  animation:pop-in .62s var(--spring) var(--card-delay,0s) forwards;
  transition:box-shadow .3s var(--ease), transform .3s var(--ease);
}
@keyframes pop-in{
  to{opacity:1;transform:none;}
}
.card.is-claimed{background:#fbfdf9;}

/* staggered inner cascade */
.card .cascade{
  opacity:0;
  transform:translateY(10px);
  animation:cascade-in .5s var(--spring) var(--inner-delay,0s) forwards;
}
@keyframes cascade-in{
  to{opacity:1;transform:none;}
}

/* ---- media + shimmer ---- */
.media{
  position:relative;
  aspect-ratio:4/3;
  background:var(--sky-100);
  overflow:hidden;
}
.media::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(100deg,#e8f5ea 8%,#f7fdf8 34%,#e8f5ea 60%);
  background-size:250% 100%;
  animation:shimmer 1.5s linear infinite;
  z-index:1;
  transition:opacity .45s var(--ease);
}
.media.loaded::before{opacity:0;}
@keyframes shimmer{
  0%{background-position:150% 0;}
  100%{background-position:-50% 0;}
}
.media img{
  position:relative;
  z-index:2;
  width:100%;height:100%;
  object-fit:contain;
  display:block;
  padding:12px;
  opacity:0;
  transition:opacity .5s var(--ease), filter .35s var(--ease), transform .35s var(--ease);
}
.media.loaded img{opacity:1;}
.card.is-claimed .media img{filter:grayscale(.42) opacity(.72);}

/* ---- reserved ribbon (hidden by default) ---- */
.ribbon{
  position:absolute;
  z-index:5;
  top:44px;
  inset-inline-start:-24px;
  width:160px;
  padding:6px 0;
  text-align:center;
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#fff;
  background:linear-gradient(135deg,#4cc47a,#1f8a4c);
  box-shadow:0 6px 16px rgba(31,157,132,.34);
  transform:rotate(-45deg) scale(.6);
  transform-origin:center;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .3s var(--ease), transform .5s var(--spring), visibility .3s;
}
.card.is-claimed .ribbon{
  opacity:1;
  visibility:visible;
  transform:rotate(-45deg) scale(1);
}

/* ---- body ---- */
.body{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:19px 19px 21px;
  flex:1 1 auto;
}
.name{
  margin:0;
  font-size:15.5px;
  line-height:1.45;
  font-weight:700;
  letter-spacing:-.01em;
  color:var(--ink);
  direction:rtl;
  text-align:right;
  overflow-wrap:anywhere;
}
.subtitle{
  margin:0;
  font-size:13px;
  line-height:1.55;
  color:var(--ink-soft);
  direction:rtl;
  text-align:right;
}
.card.is-claimed .name{color:var(--ink-soft);}

.price{
  align-self:flex-end;
  display:inline-flex;
  align-items:center;
  padding:7px 15px;
  border-radius:var(--r-pill);
  background:linear-gradient(135deg,var(--sky-100),#d7ecff);
  border:1px solid rgba(33,118,196,.16);
  color:var(--sky-700);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:-.01em;
  direction:rtl;
  white-space:nowrap;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:auto;
  padding-top:4px;
}

/* ---- shop link ---- */
.shop{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 16px;
  border-radius:14px;
  border:1.5px solid var(--sky-200);
  background:#fff;
  color:var(--sky-600);
  font-size:14.5px;
  font-weight:600;
  text-decoration:none;
  transition:background .2s var(--ease), border-color .2s var(--ease), transform .16s var(--ease);
}
.shop:active{transform:scale(.97);background:var(--sky-50);}
.shop svg{width:15px;height:15px;flex:0 0 auto;}
.shop.disabled{
  pointer-events:none;
  text-decoration:line-through;
  color:var(--ink-faint);
  border-color:rgba(138,164,186,.3);
  background:#f2f9f3;
  opacity:.75;
}

/* ---- claim button ---- */
.claim{
  position:relative;
  display:block;
  width:100%;
  overflow:hidden;
  min-height:52px;
  padding:0 18px;
  border-radius:15px;
  background:linear-gradient(135deg,var(--sky-500),var(--sky-400) 55%,#79c9f2);
  color:#fff;
  font-size:15.5px;
  font-weight:700;
  letter-spacing:-.01em;
  box-shadow:0 6px 18px rgba(59,149,224,.32);
  animation:glow 2.6s ease-in-out infinite;
  transition:transform .16s var(--ease);
  touch-action:manipulation;
}
.claim:active{transform:scale(.975);}
@keyframes glow{
  0%,100%{box-shadow:0 6px 18px rgba(59,149,224,.30), 0 0 0 0 rgba(99,181,246,.42);}
  50%{box-shadow:0 8px 24px rgba(59,149,224,.40), 0 0 0 10px rgba(99,181,246,0);}
}
.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  transform:scale(0);
  animation:ripple .62s var(--ease) forwards;
  pointer-events:none;
}
@keyframes ripple{
  to{transform:scale(2.6);opacity:0;}
}

/* ---- claimed badge ---- */
.claimed-box{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:52px;
  padding:8px 12px 8px 14px;
  border-radius:15px;
  background:linear-gradient(135deg,rgba(47,191,155,.13),rgba(47,191,155,.07));
  border:1.5px solid rgba(47,191,155,.32);
  animation:pop-badge .5s var(--spring);
}
@keyframes pop-badge{
  from{opacity:0;transform:scale(.9);}
  to{opacity:1;transform:none;}
}
.claimed-box .tick{
  flex:0 0 auto;
  width:26px;height:26px;border-radius:50%;
  background:var(--mint);
  display:grid;place-items:center;
}
.claimed-box .tick svg{width:14px;height:14px;}
.claimed-label{
  flex:1 1 auto;
  min-width:0;
  font-size:13.5px;
  font-weight:700;
  color:#1c7f6b;
  line-height:1.35;
  overflow:hidden;
  text-overflow:ellipsis;
}
.claimed-label span{display:block;font-weight:500;font-size:11.5px;color:#3f9a6e;letter-spacing:.02em;}
.release{
  flex:0 0 auto;
  min-height:48px;
  min-width:48px;
  padding:0 12px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  text-decoration:underline;
  text-underline-offset:3px;
  transition:color .2s var(--ease), transform .16s var(--ease);
}
.release:active{transform:scale(.95);color:var(--coral-dark);}

/* ---- sparkle burst ---- */
.sparkle-layer{
  position:fixed;
  inset:0;
  z-index:95;
  pointer-events:none;
  overflow:hidden;
}
.sparkle{
  position:absolute;
  width:9px;height:9px;
  border-radius:2px;
  will-change:transform,opacity;
  animation:sparkle-fly .82s var(--ease) forwards;
}
@keyframes sparkle-fly{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(0deg);opacity:1;}
  70%{opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(var(--rot));opacity:0;}
}

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.backdrop{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(12,44,70,.42);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  opacity:0;
  visibility:hidden;
  transition:opacity .32s var(--ease), visibility .32s;
}
.backdrop.open{opacity:1;visibility:visible;}

.sheet{
  position:fixed;
  z-index:91;
  inset-inline:0;
  bottom:0;
  background:#fff;
  border-radius:26px 26px 0 0;
  box-shadow:var(--shadow-lg);
  padding:10px calc(var(--sar) + 20px) calc(var(--sab) + 22px) calc(var(--sal) + 20px);
  transform:translateY(102%);
  transition:transform .42s var(--spring);
  max-width:560px;
  margin:0 auto;
  will-change:transform;
}
.sheet.open{transform:translateY(0);}
.grabber{
  width:38px;height:5px;border-radius:999px;
  background:#dbe9de;
  margin:0 auto 16px;
}
.sheet h2{
  margin:0 0 6px;
  font-size:21px;
  font-weight:800;
  letter-spacing:-.02em;
}
.sheet .sheet-sub{
  margin:0 0 18px;
  font-size:14px;
  line-height:1.5;
  color:var(--ink-soft);
  direction:rtl;
  text-align:right;
}
.sheet label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin-bottom:8px;
}
.sheet input{
  width:100%;
  min-height:52px;
  padding:0 16px;
  font-size:16px; /* 16px avoids iOS zoom-on-focus */
  font-family:inherit;
  color:var(--ink);
  background:#f2f9f3;
  border:1.5px solid var(--sky-200);
  border-radius:14px;
  outline:none;
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.sheet input:focus{border-color:var(--sky-400);background:#fff;}
.sheet-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.sheet-actions button{
  flex:1 1 0;
  min-height:52px;
  border-radius:15px;
  font-size:15.5px;
  font-weight:700;
  transition:transform .16s var(--ease), background .2s var(--ease);
}
.sheet-actions button:active{transform:scale(.975);}
.btn-ghost{
  background:#f0f7f1;
  color:var(--ink-soft);
}
.btn-solid{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--sky-500),var(--sky-400));
  color:#fff;
  box-shadow:0 6px 18px rgba(59,149,224,.30);
}
.btn-danger{
  background:linear-gradient(135deg,var(--coral),var(--coral-dark));
  color:#fff;
  box-shadow:0 6px 18px rgba(229,56,59,.28);
}

/* ============================================================
   PANIC BUTTON
   ============================================================ */
.panic-wrap{
  position:fixed;
  z-index:70;
  /* physical right: a FAB stays bottom-right in Arabic too */
  right:calc(var(--sar) + 18px);
  bottom:calc(var(--sab) + 18px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  pointer-events:none;
}
.panic{
  position:relative;
  pointer-events:auto;
  width:62px;
  height:62px;
  border-radius:50%;
  display:grid;
  place-items:center;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(140deg,#ff6b6f,#e5383b);
  box-shadow:0 10px 26px rgba(229,56,59,.42);
  transition:transform .18s var(--spring);
}
.panic:active{transform:scale(.92);}
.panic::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(255,90,95,.6);
  animation:ring 2s ease-out infinite;
  pointer-events:none;
}
@keyframes ring{
  0%{transform:scale(1);opacity:.75;}
  100%{transform:scale(1.75);opacity:0;}
}
.panic svg{width:26px;height:26px;display:block;}
.panic-label{
  pointer-events:none;
  padding:5px 11px;
  border-radius:var(--r-pill);
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border:1px solid rgba(229,56,59,.22);
  box-shadow:0 4px 12px rgba(21,86,143,.14);
  color:var(--coral-dark);
  font-size:11.5px;
  font-weight:700;
  letter-spacing:-.01em;
  line-height:1.2;
  white-space:nowrap;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot{
  padding:0 20px calc(var(--sab) + 26px);
  text-align:center;
  font-size:12.5px;
  color:var(--ink-faint);
}

/* ============================================================
   DECOR: rising bubbles behind everything
   ============================================================ */
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bubble{
  position:absolute;bottom:-90px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(159,212,255,.42));
  box-shadow:inset 0 0 12px rgba(255,255,255,.7);
  animation:bubble-up linear infinite;
  will-change:transform,opacity;
}
@keyframes bubble-up{
  0%{transform:translate3d(0,0,0) scale(.5);opacity:0;}
  10%{opacity:.55;}
  50%{transform:translate3d(26px,-52vh,0) scale(1);}
  90%{opacity:.35;}
  100%{transform:translate3d(-16px,-108vh,0) scale(1.15);opacity:0;}
}
.hero,.grid,.foot,.section-head{position:relative;z-index:1;}

/* floating icons inside the hero */
.hero-icon{
  position:absolute;
  z-index:-1;
  font-size:26px;
  line-height:1;
  opacity:0;
  filter:drop-shadow(0 6px 10px rgba(21,86,143,.16));
  animation:hero-float ease-in-out infinite;
  will-change:transform,opacity;
  pointer-events:none;
  user-select:none;
}
@keyframes hero-float{
  0%{transform:translate3d(0,18px,0) rotate(-8deg) scale(.85);opacity:0;}
  18%{opacity:.9;}
  50%{transform:translate3d(10px,-16px,0) rotate(9deg) scale(1.06);opacity:.8;}
  82%{opacity:.7;}
  100%{transform:translate3d(-6px,18px,0) rotate(-8deg) scale(.85);opacity:0;}
}

/* animated wave under the hero */
.waves{position:absolute;left:0;right:0;bottom:-2px;height:56px;overflow:hidden;line-height:0;pointer-events:none;}
.waves svg{position:absolute;bottom:0;width:220%;height:56px;}
.wave-1{fill:rgba(159,212,255,.55);animation:wave-slide 13s linear infinite;}
.wave-2{fill:rgba(244,250,255,.9);animation:wave-slide 9s linear infinite reverse;}
@keyframes wave-slide{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* animated gradient headline */
.headline{
  background-size:230% 100%;
  animation:rise .8s var(--ease) .12s forwards, headline-sheen 9s ease-in-out 1s infinite;
}
@keyframes headline-sheen{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

/* ============================================================
   SECTION HEAD + PROGRESS
   ============================================================ */
.section-head{
  max-width:1180px;
  margin:0 auto;
  padding:2px calc(var(--sar) + 18px) 20px calc(var(--sal) + 18px);
}
@media (min-width:600px){ .section-head{padding-inline:28px;} }
@media (min-width:960px){ .section-head{padding-inline:36px;} }

.kicker{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin:0 0 14px;
  font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--sky-700);
  opacity:0;animation:rise .7s var(--ease) .3s forwards;
}
.kicker i{font-style:normal;display:inline-block;animation:bob 2.4s ease-in-out infinite;}
.kicker i:last-child{animation-delay:.35s;}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-7deg) scale(1);}
  50%{transform:translateY(-6px) rotate(7deg) scale(1.14);}
}

.track{
  position:relative;height:12px;border-radius:999px;overflow:hidden;
  background:linear-gradient(180deg,#daf0e0,#eafaf0);
  border:1px solid rgba(33,118,196,.14);
  box-shadow:inset 0 1px 3px rgba(21,86,143,.10);
  opacity:0;animation:rise .7s var(--ease) .38s forwards;
}
.track-fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#1f7a42,#4caf6b 45%,#8fe0a8);
  background-size:200% 100%;
  box-shadow:0 0 12px rgba(59,149,224,.5);
  transition:width .85s var(--spring);
  animation:fill-flow 3.4s linear infinite;
}
@keyframes fill-flow{to{background-position:200% 0;}}
.track-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  transform:translateX(-100%);
  animation:sweep 2.6s ease-in-out infinite;
}
.track-label{
  margin:9px 0 0;text-align:center;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);
  opacity:0;animation:rise .7s var(--ease) .46s forwards;
}
.track-label b{color:var(--sky-600);font-size:14px;}

/* ============================================================
   EXTRA MOTION ON CARDS
   ============================================================ */
@keyframes sweep{
  0%{transform:translateX(-110%);}
  55%,100%{transform:translateX(160%);}
}

/* idle float, applied after the entrance animation finishes */
.card.settled{
  opacity:1;
  animation:card-float 8.5s ease-in-out infinite;
  animation-delay:var(--float-delay,0s);
}
/* hold still while it's being touched, or while the sheet is up */
.card.settled:hover,
.card.settled:active,
body.sheet-open .card.settled{animation-play-state:paused;}
@keyframes card-float{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(0,-5px,0);}
}
.card::before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;z-index:4;
  padding:1px;
  background:linear-gradient(130deg,rgba(99,181,246,.75),rgba(47,191,155,.55),rgba(179,145,255,.6),rgba(99,181,246,.75));
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  opacity:0;
  transition:opacity .4s var(--ease);
  animation:border-flow 6s linear infinite;
  pointer-events:none;
}
.card:hover::before{opacity:.9;}
.card.is-claimed::before{opacity:.75;}
@keyframes border-flow{to{background-position:300% 0;}}
@media (hover:hover){
  .card:hover{box-shadow:var(--shadow-md);}
}

/* shine sweeping over the photo */
.media::after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(112deg,transparent 34%,rgba(255,255,255,.6) 49%,transparent 63%);
  transform:translateX(-110%);
  animation:sweep 5.5s ease-in-out infinite;
  animation-delay:var(--sweep-delay,0s);
}
/* the product photo breathes */
.media.loaded img{animation:photo-breathe 6.5s ease-in-out infinite;animation-delay:var(--sweep-delay,0s);}
@keyframes photo-breathe{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-5px) scale(1.035);}
}

/* price pill shine */
.price{position:relative;overflow:hidden;}
.price::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.85) 50%,transparent 64%);
  transform:translateX(-110%);
  animation:sweep 4.2s ease-in-out infinite;
  animation-delay:var(--sweep-delay,0s);
  pointer-events:none;
}

/* claim button shimmer on top of the existing glow */
.claim::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.42) 50%,transparent 64%);
  transform:translateX(-110%);
  animation:sweep 3.2s ease-in-out infinite;
  pointer-events:none;
}
.claim{background-size:180% 180%;animation:glow 2.6s ease-in-out infinite, btn-flow 5s ease infinite;}
@keyframes btn-flow{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

/* ribbon shine */
.ribbon{overflow:hidden;}
.ribbon::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%);
  transform:translateX(-110%);
  animation:sweep 3.6s ease-in-out infinite 1s;
}
.card.is-claimed .tick{animation:tick-pop .6s var(--spring) .1s both, tick-pulse 2.6s ease-in-out 1s infinite;}
@keyframes tick-pop{from{transform:scale(0) rotate(-90deg);}to{transform:scale(1) rotate(0);}}
@keyframes tick-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(47,191,155,.5);}
  50%{box-shadow:0 0 0 8px rgba(47,191,155,0);}
}

/* scroll reveal */
.card.pre-reveal{animation:none;opacity:0;transform:translateY(34px) scale(.93);}

/* ============================================================
   SHEET CASCADE + PANIC WIGGLE + CONFETTI
   ============================================================ */
.sheet.open .grabber{animation:rise .4s var(--ease) .05s both;}
.sheet.open h2{animation:rise .45s var(--spring) .09s both;}
.sheet.open .sheet-sub{animation:rise .45s var(--spring) .15s both;}
.sheet.open label{animation:rise .45s var(--spring) .20s both;}
.sheet.open input{animation:rise .45s var(--spring) .25s both;}
.sheet.open .sheet-actions button:first-child{animation:rise .45s var(--spring) .30s both;}
.sheet.open .sheet-actions button:last-child{animation:rise .45s var(--spring) .36s both;}

.panic{animation:panic-wiggle 5s ease-in-out infinite;}
@keyframes panic-wiggle{
  0%,86%,100%{transform:rotate(0) scale(1);}
  89%{transform:rotate(-11deg) scale(1.07);}
  92%{transform:rotate(11deg) scale(1.07);}
  95%{transform:rotate(-7deg) scale(1.04);}
}
.panic:active{transform:scale(.92);animation:none;}

.confetti{
  position:absolute;top:-24px;
  width:10px;height:14px;
  will-change:transform,opacity;
  animation:confetti-fall linear forwards;
}
@keyframes confetti-fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:1;}
  100%{transform:translate3d(var(--drift),108vh,0) rotate(var(--spin));opacity:.15;}
}

.foot span{display:inline-block;animation:bob 2.8s ease-in-out infinite;}

/* ============================================================
   LANGUAGE GATE
   ============================================================ */
.gate{
  position:fixed;
  inset:0;
  z-index:120;
  display:none;
  place-items:center;
  padding:24px;
  background:linear-gradient(168deg,#eafaee 0%,#dcf3e2 45%,#f4faf5 100%);
}
.gate.show{display:grid;}
.gate-card{
  width:100%;
  max-width:400px;
  padding:32px 24px 26px;
  border-radius:26px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  text-align:center;
  animation:pop-in .55s var(--spring) both;
}
.gate-emoji{font-size:42px;line-height:1;display:block;margin-bottom:14px;animation:bob 2.6s ease-in-out infinite;}
.gate-card h2{
  margin:0 0 4px;
  font-size:22px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(105deg,#1f7a42,#4caf6b 50%,#f2c85e 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  padding-bottom:.06em;
}
.gate-card p{margin:0 0 22px;font-size:14px;color:var(--ink-soft);}
.gate-actions{display:flex;flex-direction:column;gap:11px;}
.gate-actions button{
  min-height:58px;
  border-radius:16px;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.01em;
  transition:transform .16s var(--ease);
}
.gate-actions button:active{transform:scale(.975);}
.gate-ar{
  background:linear-gradient(135deg,var(--sky-500),var(--sky-400));
  color:#fff;
  box-shadow:0 6px 18px rgba(59,149,224,.3);
}
.gate-en{
  background:#f0f7f1;
  color:var(--ink);
  border:1.5px solid var(--sky-200);
}

/* ============================================================
   SHARE + LANGUAGE CHIPS
   ============================================================ */
.chips{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:14px;
  opacity:0;
  animation:rise .7s var(--ease) .54s forwards;
}
.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 16px;
  border-radius:var(--r-pill);
  background:#fff;
  border:1.5px solid var(--sky-200);
  color:var(--sky-600);
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow-sm);
  transition:transform .16s var(--ease), background .2s var(--ease);
}
.chip:active{transform:scale(.96);background:var(--sky-50);}
.chip svg{width:16px;height:16px;flex:0 0 auto;}

/* ---- toast gets an action button (Undo) ---- */
.toast-action{
  flex:0 0 auto;
  min-height:40px;
  padding:0 14px;
  border-radius:12px;
  background:var(--sky-500);
  color:#fff;
  font-size:13.5px;
  font-weight:700;
  box-shadow:0 4px 12px rgba(59,149,224,.3);
  transition:transform .16s var(--ease);
}
.toast-action:active{transform:scale(.95);}
#toastText{flex:1 1 auto;}

/* ============================================================
   RTL CORRECTIONS (Arabic mode)
   ============================================================ */
html[dir="rtl"] .price{align-self:flex-start;}
html[dir="rtl"] .ribbon{transform:rotate(45deg) scale(.6);}
html[dir="rtl"] .card.is-claimed .ribbon{transform:rotate(45deg) scale(1);}
html[dir="rtl"] .claimed-box{padding:8px 14px 8px 12px;}
html[dir="rtl"] .headline,
html[dir="rtl"] .eyebrow{text-align:right;}

/* ============================================================
   POLISH
   ============================================================ */

/* keyboard focus, previously invisible */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:3px solid var(--sky-400);
  outline-offset:3px;
  border-radius:12px;
}

/* whole card acknowledges a press */
.card{transition:box-shadow .3s var(--ease), transform .18s var(--ease);}
.card.settled:active{transform:scale(.985);}

/* the claim button / claimed badge crossfade when they swap */
.claim{animation:glow 2.6s ease-in-out infinite, btn-flow 5s ease infinite, slot-in .42s var(--spring) both;}
@keyframes slot-in{
  from{opacity:0;transform:translateY(8px) scale(.96);}
  to{opacity:1;transform:none;}
}

/* somebody else just claimed this, live */
.card.just-claimed{animation:remote-pulse 1.5s var(--ease) 2;}
@keyframes remote-pulse{
  0%,100%{box-shadow:var(--shadow-sm);}
  50%{box-shadow:0 0 0 6px rgba(47,191,155,.28), 0 12px 32px rgba(47,191,155,.3);}
}

/* counter ticks over instead of snapping */
.track-label b{display:inline-block;transition:transform .3s var(--spring);}
.track-label b.tick-up{transform:scale(1.45);}

/* sheet follows the finger */
.sheet.dragging{transition:none;}

/* everything claimed */
.finale{
  display:none;
  margin:2px auto 0;
  max-width:1180px;
  text-align:center;
  font-size:15px;font-weight:700;color:#1c7f6b;
}
.finale.show{display:block;animation:pop-badge .6s var(--spring) both;}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .card,.card .cascade,.eyebrow,.headline{opacity:1 !important;transform:none !important;}
  .media::before{display:none;}
  .media img{opacity:1;}
  .sheet{transition:transform .001ms;}
  .bubbles,.hero-icon,.waves,.media::after,.price::after,.claim::after,.ribbon::after,.track-fill::after{display:none;}
  .card.settled{animation:none;}
  .card.just-claimed{animation:none;}
  .claim{animation:none;}
  .headline{animation:rise .001ms forwards;}
  .card.pre-reveal{opacity:1;transform:none;}
  .kicker,.track,.track-label,.chips{opacity:1 !important;transform:none !important;}
  .gate-emoji{animation:none;}
  .track-fill{transition:width .001ms;}
}
</style>
</head>
<body>

</div>

<section class="section-head">

      </svg><span id="langLabel"></span>

  <span class="dot"></span>
  <span id="toastText"></span>

</div>

      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.35 1.9.66 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.31 1.85.53 2.81.66A2 2 0 0 1 22 16.92z"/>
    </svg>

  <span class="panic-label" id="panicLabel"></span>
</div>

<!-- ============ BOTTOM SHEET ============ -->

  <!-- claim view -->

      <button class="btn-ghost" type="button" id="claimCancel"></button>
      <button class="btn-solid" type="button" id="claimConfirm"></button>

    </div>
  </div>
</div>

  return str;
}

function applyStatic(){

  document.getElementById('headline').innerHTML     = t('headline');

function setLang(lang, skipRender){

/* ============================================================
   4. STATE
   ============================================================ */
var reduceMotion  = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var LOCAL_KEY     = 'asma-registry-claims-v1';

var claims   = {};      // { itemId: { name, ts } }
var dbRef    = null;    // firebase ref, or null when offline
var liveSync = false;   // true once the realtime listener is attached
var pending  = null;    // { mode:'claim'|'release', id }
var myActions = {};     // ids this device just acted on, so we don't self-highlight

/* count the claimed total up rather than snapping to it */
function countTo(el, target){
  var from = parseInt(el.textContent, 10);
  if(isNaN(from)) from = 0;
  if(from === target){ el.textContent = target; return; }
  if(reduceMotion){ el.textContent = target; return; }

  clearInterval(el._timer);
  var step = target > from ? 1 : -1;
  var cur  = from;
  el._timer = setInterval(function(){
    cur += step;
    el.textContent = cur;
    el.classList.add('tick-up');
    setTimeout(function(){ el.classList.remove('tick-up'); }, 180);
    if(cur === target) clearInterval(el._timer);
  }, 130);
}

/* a short tap of haptic feedback where the device supports it */
function buzz(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- local fallback (used only when Firebase is unavailable) ---------- */
function loadLocal(){
  try{
    var raw = window.localStorage.getItem(LOCAL_KEY);
    return raw ? (JSON.parse(raw) || {}) : {};
  }catch(e){ return {}; }
}
function saveLocal(){
  try{ window.localStorage.setItem(LOCAL_KEY, JSON.stringify(claims)); }catch(e){}
}

/* ============================================================
   5. RENDER — runs immediately, never waits on the database
   ============================================================ */
var grid = document.getElementById('grid');

function buildCards(){
  var html = '';
  for(var i = 0; i < ITEMS.length; i++){
    var it = ITEMS[i];
    var cardDelay  = (0.06 + i * 0.09).toFixed(2);
    var innerBase  = (parseFloat(cardDelay) + 0.14);

    var deco = '--card-delay:' + cardDelay + 's;' +
               '--sweep-delay:' + (i * 0.85).toFixed(2) + 's;' +
               '--float-delay:' + (i * 0.55).toFixed(2) + 's;';

    html +=
      '<article class="card" id="card-' + it.id + '" style="' + deco + '">' +
        '<div class="media" id="media-' + it.id + '">' +
          '<span class="ribbon">' + esc(t('reserved')) + '</span>' +
          '<img src="' + it.image + '" alt="' + esc(it.name) + '" loading="lazy" decoding="async" ' +
               'onload="onImgSettled(\'' + it.id + '\')" onerror="onImgSettled(\'' + it.id + '\')">' +
        '</div>' +
        '<div class="body">' +
          '<h2 class="name cascade" lang="ar" dir="rtl" style="--inner-delay:' + innerBase.toFixed(2) + 's">' + esc(it.name) + '</h2>' +
          '<p class="subtitle cascade" lang="ar" dir="rtl" style="--inner-delay:' + (innerBase + 0.07).toFixed(2) + 's">' + esc(it.subtitle) + '</p>' +
          '<span class="price cascade" dir="rtl" style="--inner-delay:' + (innerBase + 0.14).toFixed(2) + 's">' + esc(it.price) + '</span>' +
          '<div class="actions cascade" style="--inner-delay:' + (innerBase + 0.21).toFixed(2) + 's">' +
            '<a class="shop" id="shop-' + it.id + '" href="' + esc(it.link) + '" target="_blank" rel="noopener noreferrer">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>' +
              '</svg>' + esc(t('shop')) + '</a>' +
            '<div id="slot-' + it.id + '"></div>' +
          '</div>' +
        '</div>' +
      '</article>';
  }
  grid.innerHTML = html;

  // images already in cache never fire onload
  var imgs = grid.querySelectorAll('.media img');
  for(var j = 0; j < imgs.length; j++){
    if(imgs[j].complete) imgs[j].parentNode.classList.add('loaded');
  }

  setupReveal();
}

/* cards below the fold pop in as you scroll to them, then start floating */
function setupReveal(){
  var cards = grid.querySelectorAll('.card');

  function settle(card){
    card.addEventListener('animationend', function onEnd(e){
      if(e.animationName !== 'pop-in') return;
      card.removeEventListener('animationend', onEnd);
      card.classList.add('settled');
    });
  }

  if(!('IntersectionObserver' in window)){
    for(var i = 0; i < cards.length; i++) settle(cards[i]);
    return;
  }

  var io = new IntersectionObserver(function(entries){
    for(var k = 0; k < entries.length; k++){
      if(!entries[k].isIntersecting) continue;
      var card = entries[k].target;
      io.unobserve(card);
      card.classList.remove('pre-reveal');
      card.style.setProperty('--card-delay', '0s');
      settle(card);
    }
  }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

  var vh = window.innerHeight || 800;
  for(var n = 0; n < cards.length; n++){
    if(cards[n].getBoundingClientRect().top < vh * 0.92){
      settle(cards[n]);            // already on screen: keep the staggered entrance
    }else{
      cards[n].classList.add('pre-reveal');
      io.observe(cards[n]);
    }
  }
}

function onImgSettled(id){
  var el = document.getElementById('media-' + id);
  if(el) el.classList.add('loaded');
}

/* ---------- paint claim state onto the already-rendered cards ---------- */
function paint(){
  var claimedCount = 0;

  for(var i = 0; i < ITEMS.length; i++){
    var it   = ITEMS[i];
    var rec  = claims[it.id];
    var card = document.getElementById('card-' + it.id);
    var shop = document.getElementById('shop-' + it.id);
    var slot = document.getElementById('slot-' + it.id);
    if(!card || !slot) continue;

    if(rec && rec.name){
      claimedCount++;
      card.classList.add('is-claimed');
      shop.classList.add('disabled');
      shop.setAttribute('aria-disabled', 'true');
      shop.setAttribute('tabindex', '-1');

      var next =
        '<div class="claimed-box">' +
          '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
          '<span class="claimed-label">' + esc(rec.name) + '<span>' + esc(t('claimed')) + '</span></span>' +
          '<button class="release" type="button" onclick="openRelease(\'' + it.id + '\')">' + esc(t('release')) + '</button>' +
        '</div>';
      if(slot.dataset.state !== 'claimed:' + LANG + ':' + rec.name){
        slot.innerHTML = next;
        slot.dataset.state = 'claimed:' + LANG + ':' + rec.name;
      }
    }else{
      card.classList.remove('is-claimed');
      shop.classList.remove('disabled');
      shop.removeAttribute('aria-disabled');
      shop.removeAttribute('tabindex');
      if(slot.dataset.state !== 'open:' + LANG){
        slot.innerHTML =
          '<button class="claim" type="button" onclick="openClaim(\'' + it.id + '\')">' + esc(t('claim')) + '</button>';
        slot.dataset.state = 'open:' + LANG;
      }
    }
  }

  var pct = ITEMS.length ? Math.round((claimedCount / ITEMS.length) * 100) : 0;
  document.getElementById('trackFill').style.width = pct + '%';
  countTo(document.getElementById('trackCount'), claimedCount);
  document.getElementById('trackTotal').textContent = ITEMS.length;

  var finale = document.getElementById('finale');
  var allDone = claimedCount === ITEMS.length && ITEMS.length > 0;
  if(allDone && !finale.classList.contains('show')){
    finale.classList.add('show');
    setTimeout(confettiRain, 120);
  }else if(!allDone){
    finale.classList.remove('show');
  }
  document.getElementById('trackSync').textContent = liveSync ? t('syncing') : '';
  document.getElementById('foot').innerHTML = t('foot');
}

/* ------------------------------------------------------------
   Language gate: ask on the first visit, remember the answer.
   The page is fully built underneath either way — the gate is
   only an overlay, so nothing depends on the choice being made.
   ------------------------------------------------------------ */
var savedLang = null;
try{ savedLang = localStorage.getItem(LANG_KEY); }catch(e){}

setLang(savedLang === 'ar' ? 'ar' : 'en', true);

/* render synchronously, before Firebase is even touched */
buildCards();
claims = loadLocal();
paint();

if(savedLang !== 'ar' && savedLang !== 'en'){
  var gate = document.getElementById('gate');
  gate.classList.add('show');
  document.getElementById('gateAr').addEventListener('click', function(){
    setLang('ar'); gate.classList.remove('show');
  });
  document.getElementById('gateEn').addEventListener('click', function(){
    setLang('en'); gate.classList.remove('show');
  });
}

/* ============================================================
   6. FIREBASE — live shared state (never blocks the render)
   ============================================================ */
function hideToast(){
  document.getElementById('toast').classList.remove('show');
}

function toast(msg, ok, actionLabel, actionFn, ms){
  var el  = document.getElementById('toast');
  var act = document.getElementById('toastAction');
  document.getElementById('toastText').textContent = msg;
  el.classList.toggle('ok', !!ok);

  if(actionLabel){
    act.textContent = actionLabel;
    act.hidden = false;
    act.onclick = function(){ hideToast(); actionFn(); };
  }else{
    act.hidden = true;
    act.onclick = null;
  }

  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, ms || 5200);
}

function initFirebase(){
  try{
    if(typeof firebase === 'undefined' || !firebase.database){
      throw new Error('Firebase SDK did not load');
    }
    if(String(FIREBASE_CONFIG.databaseURL).indexOf('PASTE_') !== -1){
      throw new Error('Firebase config not filled in');
    }

    firebase.initializeApp(FIREBASE_CONFIG);
    dbRef = firebase.database().ref(DB_PATH);

    dbRef.on('value', function(snap){
      var incoming = snap.val() || {};

      /* anything that became claimed without this device doing it was
         claimed by someone else — flash the card so it's noticeable */
      var remote = [];
      for(var id in incoming){
        if(incoming[id] && !claims[id] && !myActions[id]) remote.push(id);
      }

      claims   = incoming;
      liveSync = true;
      saveLocal();            // keep a local mirror for offline reloads
      paint();
      flashRemote(remote);
    }, function(err){
      liveSync = false;
      dbRef = null;
      paint();
      toast(t('syncErr', { code: err.code }));
    });
  }catch(e){
    dbRef = null;
    liveSync = false;
    paint();
    toast(t('syncOff'));
  }
}
initFirebase();

function flashRemote(ids){
  for(var i = 0; i < ids.length; i++){
    (function(card){
      if(!card) return;
      card.classList.remove('just-claimed');
      void card.offsetWidth;               // restart the animation
      card.classList.add('just-claimed');
      setTimeout(function(){ card.classList.remove('just-claimed'); }, 3200);
    })(document.getElementById('card-' + ids[i]));
  }
}

/* ============================================================
   7. BOTTOM SHEET
   ============================================================ */
var backdrop     = document.getElementById('backdrop');
var sheet        = document.getElementById('sheet');
var claimView    = document.getElementById('claimView');
var releaseView  = document.getElementById('releaseView');
var nameInput    = document.getElementById('claimName');

function itemById(id){
  for(var i = 0; i < ITEMS.length; i++){ if(ITEMS[i].id === id) return ITEMS[i]; }
  return null;
}

function openSheet(){
  buzz(8);
  document.body.classList.add('sheet-open');
  backdrop.classList.add('open');
  sheet.classList.add('open');
}
function closeSheet(){
  sheet.style.transform = '';
  document.body.classList.remove('sheet-open');
  backdrop.classList.remove('open');
  sheet.classList.remove('open');
  pending = null;
}

function openClaim(id){
  var it = itemById(id);
  if(!it) return;
  pending = { mode:'claim', id:id };
  claimView.hidden   = false;
  releaseView.hidden = true;
  document.getElementById('claimItemName').textContent = it.name;
  nameInput.value = '';
  openSheet();
}

function openRelease(id){
  var it = itemById(id);
  if(!it) return;
  pending = { mode:'release', id:id };
  claimView.hidden   = true;
  releaseView.hidden = false;
  document.getElementById('releaseItemName').textContent = it.name;
  openSheet();
}

/* drag the sheet down to dismiss it, the way iOS sheets behave */
(function(){
  var startY = 0, dy = 0, dragging = false;

  sheet.addEventListener('pointerdown', function(e){
    if(!sheet.classList.contains('open')) return;
    if(e.target.closest('input, button, a')) return;   // don't hijack the controls
    dragging = true; startY = e.clientY; dy = 0;
    sheet.classList.add('dragging');
    sheet.setPointerCapture(e.pointerId);
  });

  sheet.addEventListener('pointermove', function(e){
    if(!dragging) return;
    dy = Math.max(0, e.clientY - startY);             // downward only
    sheet.style.transform = 'translateY(' + dy + 'px)';
  });

  function end(){
    if(!dragging) return;
    dragging = false;
    sheet.classList.remove('dragging');
    sheet.style.transform = '';
    if(dy > 90) closeSheet();
  }
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
})();

backdrop.addEventListener('click', closeSheet);
document.getElementById('claimCancel').addEventListener('click', closeSheet);
document.getElementById('releaseCancel').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
});
nameInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('claimConfirm').click(); }
});

/* ============================================================
   8. CLAIM / RELEASE
   ============================================================ */
document.getElementById('claimConfirm').addEventListener('click', function(){
  if(!pending || pending.mode !== 'claim') return;
  var id  = pending.id;
  var who = (nameInput.value || '').trim().slice(0, 40) || t('defaultName');
  var btn = document.getElementById('slot-' + id);
  myActions[id] = true;
  closeSheet();

  if(dbRef){
    /* transaction: whoever gets there first wins — no double claims */
    dbRef.child(id).transaction(function(current){
      if(current) return;                       // already taken -> abort
      return { name: who, ts: Date.now() };
    }, function(err, committed, snap){
      if(err){
        toast(t('errClaim'));
        return;
      }
      if(!committed){
        var taken = snap && snap.val();
        toast(t('tooLate', { name: (taken && taken.name) || t('someoneElse') }));
        return;
      }
      celebrate(btn);
      buzz([12, 40, 18]);
      toast(t('thanks', { name: who }), true);
    });
  }else{
    claims[id] = { name: who, ts: Date.now() };
    saveLocal();
    paint();
    celebrate(btn);
    buzz([12, 40, 18]);
  }
});

document.getElementById('releaseConfirm').addEventListener('click', function(){
  if(!pending || pending.mode !== 'release') return;
  var id  = pending.id;
  var rec = claims[id];                     // remember it, so Undo can put it back
  myActions[id] = true;
  closeSheet();

  function offerUndo(){
    toast(t('released'), true, t('undo'), function(){ undoRelease(id, rec); }, 5000);
  }

  if(dbRef){
    dbRef.child(id).transaction(function(){ return null; }, function(err){
      if(err){ toast(t('errRelease')); return; }
      offerUndo();
    });
  }else{
    delete claims[id];
    saveLocal();
    paint();
    offerUndo();
  }
});

/* put a released gift back, but only if nobody grabbed it in the meantime */
function undoRelease(id, rec){
  if(!rec) return;
  myActions[id] = true;

  if(dbRef){
    dbRef.child(id).transaction(function(current){
      if(current) return;                   // someone else claimed it -> abort
      return rec;
    }, function(err, committed){
      if(err){ toast(t('errClaim')); return; }
      if(!committed){ toast(t('undoGone')); return; }
      buzz(10);
    });
  }else{
    claims[id] = rec;
    saveLocal();
    paint();
    buzz(10);
  }
}

/* ============================================================
   9. SHARE + LANGUAGE
   ============================================================ */
document.getElementById('shareBtn').addEventListener('click', function(){
  var url  = location.href.split('#')[0];
  var data = { title: document.title, text: t('kicker').replace(/<[^>]*>/g, '').trim(), url: url };

  if(navigator.share){
    navigator.share(data).catch(function(){ /* user dismissed the sheet */ });
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      toast(t('copied'), true);
    }).catch(function(){ window.prompt(t('share'), url); });
    return;
  }
  window.prompt(t('share'), url);
});

document.getElementById('langBtn').addEventListener('click', function(){
  setLang(LANG === 'ar' ? 'en' : 'ar');
  buzz(8);
});

/* ============================================================
   10. RIPPLE + SPARKLES
   ============================================================ */
document.addEventListener('pointerdown', function(e){
  var btn = e.target.closest ? e.target.closest('.claim, .btn-solid') : null;
  if(!btn || reduceMotion) return;
  var r = btn.getBoundingClientRect();
  var size = Math.max(r.width, r.height);
  var s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = size + 'px';
  s.style.left = (e.clientX - r.left - size / 2) + 'px';
  s.style.top  = (e.clientY - r.top  - size / 2) + 'px';
  btn.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 650);
}, true);

var SPARK_COLORS = ['#2f8f52','#8fe0a8','#4cc47a','#f2c85e','#ff8fa3','#b191ff','#ffffff'];

function confettiRain(){
  if(reduceMotion) return;
  var layer = document.getElementById('sparkles');
  for(var i = 0; i < 46; i++){
    var el = document.createElement('span');
    el.className = 'confetti';
    el.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    el.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    if(i % 4 === 0){ el.style.borderRadius = '50%'; }
    var sz = (6 + Math.random() * 7).toFixed(1) + 'px';
    el.style.width = sz; el.style.height = sz;
    el.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
    el.style.width  = (6 + Math.random() * 7).toFixed(1) + 'px';
    el.style.height = (9 + Math.random() * 9).toFixed(1) + 'px';
    el.style.setProperty('--drift', Math.round(Math.random() * 180 - 90) + 'px');
    el.style.setProperty('--spin',  Math.round(Math.random() * 900 - 450) + 'deg');
    el.style.animationDuration = (1.9 + Math.random() * 1.6).toFixed(2) + 's';
    el.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    layer.appendChild(el);
    (function(node){
      setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 4200);
    })(el);
  }
}

function celebrate(anchor){
  if(reduceMotion || !anchor) return;
  var r = anchor.getBoundingClientRect();
  var cx = r.left + r.width / 2;
  var cy = r.top + r.height / 2;
  var layer = document.getElementById('sparkles');

  for(var i = 0; i < 34; i++){
    var a  = (Math.PI * 2 * i) / 34 + Math.random() * 0.4;
    var d  = 62 + Math.random() * 110;
    var el = document.createElement('span');
    el.className = 'sparkle';
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    el.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    el.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
    el.style.setProperty('--dy', (Math.sin(a) * d - 18).toFixed(1) + 'px');
    el.style.setProperty('--rot', Math.round(Math.random() * 540 - 270) + 'deg');
    el.style.animationDelay = (Math.random() * 0.08).toFixed(3) + 's';
    layer.appendChild(el);
    (function(node){
      setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 1000);
    })(el);
  }
  confettiRain();
}

/* ============================================================
   11. AMBIENT DECOR — bubbles + floating hero icons

(function(){

  var ICONS = ['\ud83e\udd86','\ud83c\udf88','\ud83e\udd86','\ud83c\udf88','\ud83e\udd86','\ud83c\udf88','\ud83e\udd86','\ud83c\udf88'];
  var hi = document.getElementById('heroIcons');

/* ============================================================
